name: TTA Curriculum Autonomous Factory

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode Identifier (e.g., EP06)'
        required: true
        default: 'EP06'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Autonomous Build & Deploy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: 'curriculum-dossiers'
        run: |
          python build_pipeline.py --episode ${{ github.event.inputs.episode_id }}
